[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jishi"
version = "0.1.0"
description = "基石 —— 一门像 Python 一样简单易用的中文编程语言"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "jishi contributors" }]

[project.scripts]
jishi = "jishi.cli:main"
jishi-mcp = "jishi.mcp_server:main"

[tool.setuptools]
packages = ["jishi", "jishi.stdlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
