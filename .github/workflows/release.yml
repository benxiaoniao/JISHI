name: Release

# 打 tag（如 v0.2.0）自动触发；也可在 Actions 页面手动运行
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 需要创建 Release、上传文件

jobs:
  build:
    name: 构建 · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller pytest

      # Windows 编译 C 虚拟机：优先用 runner 预装的 MSYS2 gcc
      - name: 准备 gcc（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "=== 探测可用 gcc ==="
          which gcc 2>/dev/null && echo "PATH 中已有 gcc" || echo "(PATH 中无 gcc)"
          for d in "/c/msys64/mingw64/bin" "/c/msys64/ucrt64/bin"; do
            if [ -x "$d/gcc.exe" ]; then
              echo "使用 MSYS2 gcc：$d"
              echo "$d" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "未找到预装 gcc，改用 Chocolatey 安装 MinGW..."
          choco install mingw -y --no-progress
          GCC_EXE=$(find /c/ProgramData/chocolatey -name gcc.exe 2>/dev/null | head -1)
          if [ -n "$GCC_EXE" ]; then
            echo "使用 choco gcc：$GCC_EXE"
            dirname "$GCC_EXE" >> "$GITHUB_PATH"
          else
            echo "错误：仍未找到 gcc"; exit 1
          fi

      # Inno Setup 生成真正的 Windows 安装程序（M19.1）
      - name: 安装 Inno Setup（Windows）
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      - name: 全量测试
        run: python -m pytest tests/ -q

      # Windows 上会自动尝试调用 ISCC 生成 setup.exe
      - name: 构建发行包
        run: python tools/build_release.py

      - name: 校验产物
        shell: bash
        run: |
          echo "== dist/release =="
          ls -la dist/release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.exe
            dist/release/SHA256SUMS

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 汇总产物并生成统一校验和
        shell: bash
        run: |
          cd artifacts
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS
          echo "== 发布文件 =="
          ls -la
          echo "== SHA256SUMS =="
          cat SHA256SUMS

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
