name: Release

# 打 tag（如 v0.2.0）自动触发；也可在 Actions 页面手动运行
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 需要创建 Release、上传文件

jobs:
  build:
    name: 构建 · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller pytest

      # Windows 编译 C 虚拟机需要 MinGW-w64
      - name: 安装 MinGW（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw -y --no-progress
          # choco 装完不刷新当前 shell 的 PATH，显式把 gcc 目录加入后续步骤
          for d in "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin" \
                   "/c/ProgramData/chocolatey/bin"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done
          find /c/ProgramData/chocolatey -maxdepth 7 -name gcc.exe 2>/dev/null | head -3

      # Inno Setup 生成真正的 Windows 安装程序（M19.1）
      - name: 安装 Inno Setup（Windows）
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      - name: 全量测试
        run: python -m pytest tests/ -q

      # Windows 上会自动尝试调用 ISCC 生成 setup.exe
      - name: 构建发行包
        run: python tools/build_release.py

      - name: 校验产物
        shell: bash
        run: |
          echo "== dist/release =="
          ls -la dist/release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.exe
            dist/release/SHA256SUMS

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 汇总产物并生成统一校验和
        shell: bash
        run: |
          cd artifacts
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS
          echo "== 发布文件 =="
          ls -la
          echo "== SHA256SUMS =="
          cat SHA256SUMS

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
