name: Release

# 打 tag（如 v0.2.0）自动触发；也可在 Actions 页面手动运行
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 需要创建 Release、上传文件

jobs:
  build:
    name: 构建 · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows 上 Python stdout 默认非 UTF-8，打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller pytest

      # R8.3：发行包改成 **cargo 产物**（单二进制）。runner 自带 rustup，
      # 但显式钉一下 stable，免得哪天镜像变了。
      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # Windows 编译 C 虚拟机：用 MSYS2 工具链（runner 预装 MSYS2 但无 gcc）
      - name: 准备 gcc（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 确认 gcc（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: gcc --version | head -1

      # Inno Setup 生成真正的 Windows 安装程序（M19.1）
      - name: 安装 Inno Setup（Windows）
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress --timeout 600

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      # 🔴 2026-10-09：同上 ——「全量测试」之前必须把 Rust 两份产物编出来，
      # 否则 74 个对拍/工具用例**静默跳过**（是 skip，不是 fail）。
      - name: 构建 Rust 宿主（测试要用）
        run: cargo build --release --manifest-path rust/Cargo.toml

      # ⚠️ 用 bash 包一层：cargo 失败时只在 job 日志里留痕（而日志要登录网页才看得到），
      #    这里顺手把它写成 Actions 注解 —— 2026-10-09 macos 上这一步退出码 101、
      #    注解却是空的，查了半天。诊断信息必须是**公开 API 拿得到**的。
      - name: 构建前端扩展（pyo3，测试要用）
        shell: bash
        run: |
          set +e
          # ⚠️ `-u`：不缓冲 stdout —— 否则 stdout/stderr 在日志里**交错错乱**，
          #    排查时看到的顺序是假的（2026-10-10 就被这个误导过）。
          python -u core/build.py 2>&1 | tee pyo3.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error file=.github/workflows/ci.yml,line=1::pyo3 扩展构建失败（rc=$rc）：$(tail -c 1800 pyo3.log | tr -d '\r' | tr '\n' ' ')"
          fi
          exit "$rc"

      # 全量测试：三执行器对拍（树遍历 / Python VM / C VM 逐字节一致）

      # 环境诊断（M35 加）：时区/平台这类「开发机与 CI 不同」的事实，先打出来。
      # 来由：时间格式化在 CI 上不一致，而本地（UTC+8）永远复现不了——与其猜，
      # 不如让 CI 把自己的事实说清楚。
      - name: 环境诊断
        shell: bash
        run: |
          # 同时写进 env-diag.txt：job 日志只有登录网页能看，而「失败摘要」注解
          # 可以带文件内容一起发出去（M35）
          {
            echo "date: $(date)"
            echo "TZ=${TZ:-<未设置>}"
            echo -n "python 本地时区: "
            python -c "import time,datetime;print(time.tzname, datetime.datetime.fromtimestamp(0))"
            echo -n "python utcfromtimestamp(0): "
            python -c "import datetime;print(datetime.datetime.utcfromtimestamp(0))"
            echo -n "node: "
            node -e "console.log(new Date(0).toString(), '| offset', new Date(0).getTimezoneOffset(), '| TZ', process.env.TZ)"
            echo -n "/etc/localtime: "
            (ls -l /etc/localtime 2>/dev/null || echo "（无）")
          } 2>&1 | tee env-diag.txt

      - name: 全量测试
        shell: bash
        run: |
          set -o pipefail
          # ⚠️ `--tb=short`（不是 `--tb=line`）：`--tb=line` **每次失败只给一行**，
          # 多行的断言消息（探针会把「哪几条不一致 + 各引擎的值」打成多行）
          # 会被吃光，注解里只看得到「AssertionError: 标准库体检没过：」这种空壳
          # —— 2026-10-09 排查 m67 时正是被这个坑住的。
          #
          # 🔴 **只跑「非墙上护栏」的用例**（`-m "not 计时"`）：`计时` 那批断言的是
          # **墙上时间**（例：「20 万次调用 < 300ms」），而共享 runner 的负载能把
          # 同一份代码抬到 2~3 倍 —— 实测本机 202ms、CI Windows 上 386ms，
          # 于是**假红挡住发版**（2026-10-09 的 v0.2.2 就是这么连红三轮的）。
          # 绝对耗时阈值在 CI 上**没有判别力**；墙上护栏照 `AGENTS.md` §1 的配方
          # **在本机串行跑**（`python -m pytest tests/ -m 计时`）。
          python -m pytest tests/ -q --tb=short -rf -m "not 计时" 2>&1 | tee pytest.log

      # 失败时把「哪些用例挂了」写成 Actions 注解（M35 加）。
      # 来由：CI 一直红，而 job 日志只能登录网页看、公开 API 下载要管理员权限，
      # 排查时两眼一抹黑。注解可以用公开 API 读到（check-runs/annotations），
      # 于是「失败摘要」变成可被工具直接取到的信息。
      - name: 失败摘要（写成注解）
        if: failure()
        shell: bash
        run: |
          # 必须 set +e：pytest 被**中断**时（退出码 2）日志里没有 FAILED 行，
          # grep 返回 1，在 -e 下会把这一步本身弄挂、注解反而写不出来
          # （M35 实测踩到，白等一轮 CI）。
          set +e
          if [ ! -f pytest.log ]; then
            echo "::error file=.github/workflows/ci.yml,line=1::pytest.log 不存在（测试步骤可能没执行到 tee）"
            exit 0
          fi
          # 🔴 **FAILED 列表放最前**（M116 发版踩到）：GitHub 注解的 message
          # 只留 **1024 字符**，而 pytest 输出里 `E ` 行（多行断言）在前、
          # `FAILED` 行在后 —— 原来一股脑拼起来，1024 字符**刚好把失败清单截掉**，
          # 只剩几条断言，根本不知道挂了几条、挂的是哪些。
          # ⇒ 先给清单（短、信息量最大），再给前几条断言细节。
          FAILED_LIST=$(grep -aE '^(FAILED|ERROR)' pytest.log | head -30 | tr -d '\r' | tr '\n' ' ')
          DETAIL=$(grep -aE '^E  ' pytest.log | head -8 | tr -d '\r' | tr '\n' ' ')
          SUMMARY="【清单】${FAILED_LIST} 【细节】${DETAIL}"
          if [ -z "$FAILED_LIST" ]; then
            # ⚠️ 判空要判 **FAILED_LIST**，不能判 SUMMARY —— 后者现在至少含
            #    「【清单】【细节】」两个标签，永远非空，兜底分支就永远走不到。
            # 没有 FAILED 行 —— 多半是进程被中断/崩溃，退回日志末尾
            SUMMARY="【无 FAILED 行，退回日志末尾】(exit=$(tail -c 200 pytest.log | tr -d '\r\n' | tail -c 60)) $(tail -c 700 pytest.log | tr -d '\r' | tr '\n' ' ')"
          fi
          DIAG=""
          if [ -f env-diag.txt ]; then
            DIAG="【环境】$(tr -d '\r' < env-diag.txt | tr '\n' ' ') "
          fi
          SUMMARY=$(printf '%s' "$SUMMARY" | sed 's/%/%25/g')
          echo "::error file=.github/workflows/ci.yml,line=1::${DIAG}【失败】${SUMMARY}"
          exit 0

      # R8.3：发行物 = **cargo 单二进制**（`rust/`），不再走 PyInstaller。
      # ⚠️ 仍用 Python 跑的只有**构建脚本**本身（生成语言卡 / 站点资源），运行时零依赖。
      # Windows 上会自动尝试调用 ISCC 生成 setup.exe
      - name: 构建发行包（cargo）
        run: python tools/build_release.py --engine rust

      - name: 校验产物
        shell: bash
        run: |
          echo "== dist/release =="
          ls -la dist/release/
          echo "== 包内 bin/ 布局（R8.3 起是平铺的） =="
          python - <<'PY'
          import glob, tarfile, zipfile
          for z in sorted(glob.glob("dist/release/*.zip")):
              with zipfile.ZipFile(z) as zf:
                  print(z, "→", [n for n in zf.namelist() if "/bin/" in n and n.count("/") == 2])
          for t in sorted(glob.glob("dist/release/*.tar.gz")):
              with tarfile.open(t) as tf:
                  names = tf.getnames()
              print(t, "→", [n for n in names if "/bin/" in n and n.count("/") == 2])
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.exe
            dist/release/SHA256SUMS

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # 🔴 **必须检出仓库**：下面「生成语言本体版本清单」要跑
      #    `tools/build_version_manifest.py`（M110 新加的那一步）——
      #    没有检出，Python 连脚本文件都打不开（`can't open file` ⇒ **退出码 2**，
      #    5 秒就失败）。0.2.2 时这步还不存在（只要下载产物 + shell 拼校验和），
      #    所以一直没暴露；**0.2.3 是它第一次真跑**。
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # M110：语言本体版本清单（`jishi 升级` 的入口）。
      # ⚠️ **必须在「统一校验和」之前生成** —— 这样它自己也进 SHA256SUMS；
      #    否则镜像同步那边会遇到「资产不在清单里」，而那正是「拿没校验
      #    充当校验通过」的形状（`fetch_release_mirror.py` 会硬报错）。
      # ⚠️ **也只能在这里生成**：它是「三平台合并之后」的产物，只有 CI 手里
      #    同时有三个平台的真包。本机 `build_release.py` 只产一个平台，
      #    生成出来的清单是残的（`build_version_manifest.py` 会拒绝那种）。
      - name: 生成语言本体版本清单（jishi-release.json）
        shell: bash
        run: |
          python tools/build_version_manifest.py artifacts \
            --输出 artifacts/jishi-release.json
          cat artifacts/jishi-release.json

      - name: 汇总产物并生成统一校验和
        shell: bash
        run: |
          cd artifacts
          rm -f SHA256SUMS
          # ⚠️ 必须**排除 `SHA256SUMS` 自己**（2026-10-11 才发现）：`> SHA256SUMS`
          #    会先把这个空文件创建出来，紧接着的 `find .` 就把它也算了一行 ——
          #    于是清单里多出 `e3b0c442…b855  SHA256SUMS`（**空字符串**的 SHA256）。
          #    后果：用户 `sha256sum -c SHA256SUMS` 时那一行必然 FAILED，看着像包坏了。
          #    两头堵：`! -name` 排除自己 + 写临时文件、最后才改名。
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            | sed 's|\./||' > /tmp/SHA256SUMS.new
          mv /tmp/SHA256SUMS.new SHA256SUMS
          echo "== 发布文件 =="
          ls -la
          echo "== SHA256SUMS =="
          cat SHA256SUMS

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
