name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（Python ${{ matrix.python }} · ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    env:
      # Windows 上 Python stdout 默认非 UTF-8，打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 pytest
        run: python -m pip install pytest

      - name: 安装项目（可编辑）
        run: python -m pip install -e .

      # 编译 C 虚拟机所需 gcc：Ubuntu 自带；Windows 用 MSYS2 工具链
      - name: 准备 gcc（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 确认 gcc（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: gcc --version | head -1

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      # 全量测试：三执行器对拍（树遍历 / Python VM / C VM 逐字节一致）
      - name: 全量测试
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=line -rf 2>&1 | tee pytest.log

      # 失败时把「哪些用例挂了」写成 Actions 注解（M35 加）。
      # 来由：CI 一直红，而 job 日志只能登录网页看、公开 API 下载要管理员权限，
      # 排查时两眼一抹黑。注解可以用公开 API 读到（check-runs/annotations），
      # 于是「失败摘要」变成可被工具直接取到的信息。
      - name: 失败摘要（写成注解）
        if: failure()
        shell: bash
        run: |
          if [ -f pytest.log ]; then
            SUMMARY=$(grep -E '^(FAILED|ERROR)' pytest.log | head -25 | tr -d '\r' | tr '\n' ' ')
            if [ -z "$SUMMARY" ]; then
              SUMMARY=$(tail -c 500 pytest.log | tr -d '\r' | tr '\n' ' ')
            fi
            CLEAN=$(printf '%s' "$SUMMARY" | sed 's/[%]//g')
            echo "::error title=pytest 失败摘要::${CLEAN}"
          fi

      # 一键全检（含 C VM 构建 + 基准冒烟）
      - name: 一键全检
        run: python tools/ci.py
