name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（Python ${{ matrix.python }} · ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    env:
      # Windows 上 Python stdout 默认非 UTF-8，打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 pytest
        run: python -m pip install pytest

      - name: 安装项目（可编辑）
        run: python -m pip install -e .

      # 编译 C 虚拟机所需 gcc：Ubuntu 自带；Windows 用 MSYS2 工具链
      - name: 准备 gcc（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 确认 gcc（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: gcc --version | head -1

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      # 全量测试：三执行器对拍（树遍历 / Python VM / C VM 逐字节一致）
      - name: 全量测试
        run: python -m pytest tests/ -q

      # 一键全检（含 C VM 构建 + 基准冒烟）
      - name: 一键全检
        run: python tools/ci.py
