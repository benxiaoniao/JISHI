name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（Python ${{ matrix.python }} · ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    env:
      # Windows 上 Python stdout 默认非 UTF-8，打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 🔻 2026-10-10 起**只跑一个 Python 版本**（原先 3.10 + 3.13 两档）。
        #    缘由（作者定）：那两档是当初照「本机装了两个 Python」设的，
        #    对这个**语言项目**来说并不是真需求 —— Python 侧已退役
        #    （只作判据基准），版本约束只影响作者自己，没必要拿两倍的
        #    runner 额度去守它。留 3.13：本机 venv 与 Release 构建都用它。
        #    ⚠️ 因此 `pyproject.toml` 的 `requires-python` 同步提到 `>=3.13`
        #    （声明必须与实际测过的一致，不许「声明 3.10、只测 3.13」）。
        #    📌 跨 Python 版本的**语法陷阱**仍有兜底：`test_m57_conformance.py`
        #    第七节用 AST 扫描「f-string 表达式里含反斜杠」（3.12 以下直接
        #    SyntaxError）—— 那条在**任何**版本上跑都会红，不依赖多版本矩阵。
        python: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 pytest
        run: python -m pip install pytest

      - name: 安装项目（可编辑）
        run: python -m pip install -e .

      # 编译 C 虚拟机所需 gcc：Ubuntu 自带；Windows 用 MSYS2 工具链
      - name: 准备 gcc（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 确认 gcc（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: gcc --version | head -1

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      # 🔴 2026-10-09：**测试前必须把 Rust 那两份产物编出来**，否则「全量测试」
      # 名不副实 —— 实测：没有 `rust/target/release/jishi-rs` 时，74 个
      # 对拍/工具用例是**直接跳过**（`skipif`）而不是失败，CI 一直静默少跑这一批；
      # 没有 `oracle/jishi/_core.*` 时前端四阶段那批也跳过。
      # 症状是「CI 全绿但本地能跑出的问题它看不见」。
      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 Rust 宿主（测试要用）
        run: cargo build --release --manifest-path rust/Cargo.toml

      # ⚠️ 用 bash 包一层：cargo 失败时只在 job 日志里留痕（而日志要登录网页才看得到），
      #    这里顺手把它写成 Actions 注解 —— 2026-10-09 macos 上这一步退出码 101、
      #    注解却是空的，查了半天。诊断信息必须是**公开 API 拿得到**的。
      - name: 构建前端扩展（pyo3，测试要用）
        shell: bash
        run: |
          set +e
          # ⚠️ `-u`：不缓冲 stdout —— 否则 stdout/stderr 在日志里**交错错乱**，
          #    排查时看到的顺序是假的（2026-10-10 就被这个误导过）。
          python -u core/build.py 2>&1 | tee pyo3.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error file=.github/workflows/ci.yml,line=1::pyo3 扩展构建失败（rc=$rc）：$(tail -c 1800 pyo3.log | tr -d '\r' | tr '\n' ' ')"
          fi
          exit "$rc"

      # 全量测试：三执行器对拍（树遍历 / Python VM / C VM 逐字节一致）

      # 环境诊断（M35 加）：时区/平台这类「开发机与 CI 不同」的事实，先打出来。
      # 来由：时间格式化在 CI 上不一致，而本地（UTC+8）永远复现不了——与其猜，
      # 不如让 CI 把自己的事实说清楚。
      - name: 环境诊断
        shell: bash
        run: |
          # 同时写进 env-diag.txt：job 日志只有登录网页能看，而「失败摘要」注解
          # 可以带文件内容一起发出去（M35）
          {
            echo "date: $(date)"
            echo "TZ=${TZ:-<未设置>}"
            echo -n "python 本地时区: "
            python -c "import time,datetime;print(time.tzname, datetime.datetime.fromtimestamp(0))"
            echo -n "python utcfromtimestamp(0): "
            python -c "import datetime;print(datetime.datetime.utcfromtimestamp(0))"
            echo -n "node: "
            node -e "console.log(new Date(0).toString(), '| offset', new Date(0).getTimezoneOffset(), '| TZ', process.env.TZ)"
            echo -n "/etc/localtime: "
            (ls -l /etc/localtime 2>/dev/null || echo "（无）")
          } 2>&1 | tee env-diag.txt

      - name: 全量测试
        shell: bash
        run: |
          set -o pipefail
          # ⚠️ `--tb=short`（不是 `--tb=line`）：`--tb=line` **每次失败只给一行**，
          # 多行的断言消息（探针会把「哪几条不一致 + 各引擎的值」打成多行）
          # 会被吃光，注解里只看得到「AssertionError: 标准库体检没过：」这种空壳
          # —— 2026-10-09 排查 m67 时正是被这个坑住的。
          #
          # 🔴 **只跑「非墙上护栏」的用例**（`-m "not 计时"`）：`计时` 那批断言的是
          # **墙上时间**（例：「20 万次调用 < 300ms」），而共享 runner 的负载能把
          # 同一份代码抬到 2~3 倍 —— 实测本机 202ms、CI Windows 上 386ms，
          # 于是**假红挡住发版**（2026-10-09 的 v0.2.2 就是这么连红三轮的）。
          # 绝对耗时阈值在 CI 上**没有判别力**；墙上护栏照 `AGENTS.md` §1 的配方
          # **在本机串行跑**（`python -m pytest tests/ -m 计时`）。
          python -m pytest tests/ -q --tb=short -rf -m "not 计时" 2>&1 | tee pytest.log

      # 失败时把「哪些用例挂了」写成 Actions 注解（M35 加）。
      # 来由：CI 一直红，而 job 日志只能登录网页看、公开 API 下载要管理员权限，
      # 排查时两眼一抹黑。注解可以用公开 API 读到（check-runs/annotations），
      # 于是「失败摘要」变成可被工具直接取到的信息。
      - name: 失败摘要（写成注解）
        if: failure()
        shell: bash
        run: |
          # 必须 set +e：pytest 被**中断**时（退出码 2）日志里没有 FAILED 行，
          # grep 返回 1，在 -e 下会把这一步本身弄挂、注解反而写不出来
          # （M35 实测踩到，白等一轮 CI）。
          set +e
          if [ ! -f pytest.log ]; then
            echo "::error file=.github/workflows/ci.yml,line=1::pytest.log 不存在（测试步骤可能没执行到 tee）"
            exit 0
          fi
          # 连 pytest 的 `E ` 行一起抓：多行的断言消息（含双方实际输出）
          # 就藏在这些行里，只看 FAILED 行只能看到被截断的那一小段
          SUMMARY=$(grep -aE '^(FAILED|ERROR|E )' pytest.log | head -40 | tr -d '\r' | tr '\n' ' ')
          if [ -z "$SUMMARY" ]; then
            # 没有 FAILED 行 —— 多半是进程被中断/崩溃，退回日志末尾
            SUMMARY="【无 FAILED 行，退回日志末尾】(exit=$(tail -c 200 pytest.log | tr -d '\r\n' | tail -c 60)) $(tail -c 700 pytest.log | tr -d '\r' | tr '\n' ' ')"
          fi
          DIAG=""
          if [ -f env-diag.txt ]; then
            DIAG="【环境】$(tr -d '\r' < env-diag.txt | tr '\n' ' ') "
          fi
          SUMMARY=$(printf '%s' "$SUMMARY" | sed 's/%/%25/g')
          echo "::error file=.github/workflows/ci.yml,line=1::${DIAG}【失败】${SUMMARY}"
          exit 0

      # 一键全检（含 C VM 构建 + 基准冒烟 + 一致性夹具 + 内建体检）
      - name: 一键全检
        shell: bash
        env:
          # 🔴 `ci.py` 内部**也会跑一遍 `pytest tests/`** —— 上一一步已经跑过了，
          #    再跑一遍纯浪费：实测 Windows runner 上那一遍要 3924 秒（65 分钟），
          #    两个步骤叠一起把 job 拖到 **2 小时 10 分**（2026-10-10）。
          #    传这个开关让它跳过；CI 那遍 pytest 由「全量测试」步骤负责
          #    （那里带 `-m "not 计时"`：墙上护栏在共享 runner 上没有判别力）。
          JISHI_SKIP_PYTEST: "1"
        run: |
          set -o pipefail
          python tools/ci.py 2>&1 | tee ci.log

      # 一键全检失败时也要能看到「哪一步挂了」（M57 补）。
      # 来由：ubuntu 两个任务一直是「全量测试✅、一键全检❌」，而 **ci.py 的
      # 输出没有进注解** —— 公开 API 只能读到注解，于是等于「只知道红了、
      # 不知道为什么」。这条把它的摘要也写成注解。
      - name: 一键全检失败摘要（写成注解）
        if: failure()
        shell: bash
        run: |
          # `set +e`：这一步本身绝不能把 job 弄挂（M35 的教训）
          set +e
          if [ ! -f ci.log ]; then
            exit 0     # 没跑到这里（多半是「全量测试」先挂了，已有另一条注解）
          fi
          # ⚠️ 也要抓 `✗` 与「悬案」这类行 —— ci.py 里几个体检工具**不输出
          # `FAILED`**，它们的失败长这样（2026-09-30 白跑了一轮才补上）。
          SUMMARY=$(grep -aE -B 1 -A 2 '(^FAILED|^ERROR|^E |.*Error:|Traceback|✗|悬案|不一致|--- .*(失败|通过) ---)' ci.log \
                    | tail -30 | tr -d '\r' | tr '\n' ' ')
          if [ -z "$SUMMARY" ]; then
            SUMMARY="【无匹配行，退回日志末尾】$(tail -c 900 ci.log | tr -d '\r' | tr '\n' ' ')"
          fi
          SUMMARY=$(printf '%s' "$SUMMARY" | sed 's/%/%25/g')
          echo "::error file=tools/ci.py,line=1::【一键全检失败】${SUMMARY}"
          exit 0
