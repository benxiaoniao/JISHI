name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（Python ${{ matrix.python }} · ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 pytest
        run: python -m pip install pytest

      - name: 安装项目（可编辑）
        run: python -m pip install -e .

      # 编译 C 虚拟机所需 gcc：Ubuntu 自带；Windows 用 choco 装 MinGW-w64
      - name: 安装 MinGW（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw -y --no-progress
          # choco 装完不刷新当前 shell 的 PATH，显式把 gcc 目录加入后续步骤
          for d in "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin" \
                   "/c/ProgramData/chocolatey/bin"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done
          find /c/ProgramData/chocolatey -maxdepth 7 -name gcc.exe 2>/dev/null | head -3

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      # 全量测试：三执行器对拍（树遍历 / Python VM / C VM 逐字节一致）
      - name: 全量测试
        run: python -m pytest tests/ -q

      # 一键全检（含 C VM 构建 + 基准冒烟）
      - name: 一键全检
        run: python tools/ci.py
