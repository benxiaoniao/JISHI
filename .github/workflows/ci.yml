name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（Python ${{ matrix.python }} · ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 pytest
        run: python -m pip install pytest

      - name: 安装项目（可编辑）
        run: python -m pip install -e .

      # 编译 C 虚拟机所需 gcc：Ubuntu 自带；Windows 优先用 runner 预装的 MSYS2
      - name: 准备 gcc（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "=== 探测可用 gcc ==="
          which gcc 2>/dev/null && echo "PATH 中已有 gcc" || echo "(PATH 中无 gcc)"
          for d in "/c/msys64/mingw64/bin" "/c/msys64/ucrt64/bin"; do
            if [ -x "$d/gcc.exe" ]; then
              echo "使用 MSYS2 gcc：$d"
              echo "$d" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "未找到预装 gcc，改用 Chocolatey 安装 MinGW..."
          choco install mingw -y --no-progress
          GCC_EXE=$(find /c/ProgramData/chocolatey -name gcc.exe 2>/dev/null | head -1)
          if [ -n "$GCC_EXE" ]; then
            echo "使用 choco gcc：$GCC_EXE"
            dirname "$GCC_EXE" >> "$GITHUB_PATH"
          else
            echo "错误：仍未找到 gcc"; exit 1
          fi

      - name: 构建 C 虚拟机
        run: python cvm/build.py

      # 全量测试：三执行器对拍（树遍历 / Python VM / C VM 逐字节一致）
      - name: 全量测试
        run: python -m pytest tests/ -q

      # 一键全检（含 C VM 构建 + 基准冒烟）
      - name: 一键全检
        run: python tools/ci.py
