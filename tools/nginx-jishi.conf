# 基石官网 + 文档站 + 分发包（M49）
#
# 安装：
#     cp /srv/jishi-src/tools/nginx-jishi.conf /etc/nginx/sites-available/jishi
#     ln -sf /etc/nginx/sites-available/jishi /etc/nginx/sites-enabled/jishi
#     rm -f /etc/nginx/sites-enabled/default
#     nginx -t && systemctl reload nginx
#
# ⚠️ 这里**不写服务器 IP、不写证书路径**：
# HTTPS 由 EdgeOne 在 CDN 层终止（对外只有域名，源站只提供 HTTP）——
# 于是源站不需要证书，也不会把源站地址暴露出去。
# 这份配置因此可以进公开仓库（见 `AGENTS.md` §8）。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/jishi;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        # 允许 /start 这种不带 .html 的写法（静态站点常见需求）
        try_files $uri $uri/ $uri.html =404;
    }

    # 分发包（`jishi 安装` 的下载源）：索引 JSON + 各版本 zip
    location /packages/ {
        autoindex off;
        add_header Cache-Control "public, max-age=300";
        types { application/json json; }
    }

    # 静态资源长缓存（文件名不带指纹，所以只给 7 天）
    location ~* \.(css|js|png|jpg|jpeg|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 万一构建源被放进了 web 根，也别让它可下载
    location ~ ^/\.(git|jishi) { deny all; return 404; }

    access_log /var/log/nginx/jishi.access.log;
    error_log  /var/log/nginx/jishi.error.log;
}
