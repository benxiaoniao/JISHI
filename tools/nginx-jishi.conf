# 基石官网 + 文档站 + 分发包（M49）—— HTTP(80) 入口
#
# 安装：
#     cp /srv/jishi-src/tools/nginx-jishi.conf       /etc/nginx/sites-available/jishi
#     cp /srv/jishi-src/tools/nginx-jishi-tls.conf   /etc/nginx/sites-available/jishi-tls
#     cp /srv/jishi-src/tools/nginx-jishi-locations.conf \
#        /etc/nginx/snippets/jishi-locations.conf
#     ln -sf /etc/nginx/sites-available/jishi      /etc/nginx/sites-enabled/jishi
#     ln -sf /etc/nginx/sites-available/jishi-tls  /etc/nginx/sites-enabled/jishi-tls
#     rm -f /etc/nginx/sites-enabled/default
#     nginx -t && systemctl reload nginx
#
# ⚠️ 这里**不写服务器 IP**：对外只暴露域名，源站地址不进公开仓库
# （见 `AGENTS.md` §8 的隐私规矩）。证书路径里的域名是公开信息，可以写。
#
# 📌 为什么要同时监听 443（2026-09-29 实测记录）：
#   一开始源站只有 80，EdgeOne 上 HTTP 访问正常（200）、**HTTPS 访问 521**
#   （Connection Reset by Origin Server）。抓日志才看清：HTTP 请求在源站
#   `access.log` 里有记录、HTTPS 请求**根本没有记录** —— 说明 CDN 为 HTTPS
#   请求走的是**另一条回源路径**（HTTPS 回源到 443），而源站没人在 443 上监听。
#   结论：**只把源站当纯 HTTP 后端是不够的**，443 也得有人应答。
#   （另一条路是在 EdgeOne 把「回源协议」显式改成 HTTP；本配置让两种都能通。）
#
# 站点规则在 `nginx-jishi-locations.conf`（两个端口 include 同一份，避免漂移）。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/jishi-locations.conf;
}
