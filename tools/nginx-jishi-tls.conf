# 基石站点 · HTTPS(443) 入口（M49）
#
# 为什么需要它：见 `nginx-jishi.conf` 顶部那段（EdgeOne 对 HTTPS 请求走 HTTPS 回源，
# 源站没有 443 监听就会 521）。**这份配置让源站两种回源协议都能应答。**
#
# 证书：Let's Encrypt（certbot，webroot 模式）。
#     certbot certonly --webroot -w /var/www/jishi -d xn--3jsy75e.cn
# 续期由 certbot 自带的 systemd 定时器负责；续期后需要 reload nginx：
#     /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
#
# ⚠️ 证书路径里的域名（基石.cn）是**公开信息**，可以进仓库；服务器 IP 不行。
# ⚠️ 这份配置依赖证书存在 —— 证书还没有时先别 enable 它，否则 `nginx -t` 会失败。
#     `tools/site_sync.sh` 会自己判断：证书不在就跳过 enable。

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/xn--3jsy75e.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--3jsy75e.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:JISHI_TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/jishi-locations.conf;
}
