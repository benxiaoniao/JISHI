# 基石站点 · 共用片段（被 80 与 443 两个 server 块 include）
#
# ⚠️ 单独成文件是为了**一处维护**：两个端口提供的站点必须完全一致，
# 复制两份迟早会漂（站点规则改了一处忘了另一处，只在 HTTPS 或只在 HTTP 上生效，
# 而这种"只有一个端口有问题"的 bug 最难查）。
#
# 安装位置：/etc/nginx/snippets/jishi-locations.conf

root /var/www/jishi;
index index.html;
charset utf-8;

gzip on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml;

location / {
    # 允许 /start 这种不带 .html 的写法（静态站点常见需求）
    try_files $uri $uri/ $uri.html =404;
}

# 分发包（`jishi 安装` 的下载源）：索引 JSON + 各版本 zip
location /packages/ {
    autoindex off;
    add_header Cache-Control "public, max-age=300";
    types { application/json json; }
}

# 发行包在线下载（安装程序 / 各平台压缩包，M49）：**文件名带版本号，内容永不改**
# → 可以长缓存。这是给大陆用户的直接用 GitHub 之外的另一条路。
location /download/ {
    autoindex off;
    expires 30d;
    add_header Cache-Control "public";
}

# 静态资源长缓存（文件名不带指纹，所以只给 7 天）
location ~* \.(css|js|png|jpg|jpeg|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
}

# 万一构建源被放进了 web 根，也别让它可下载
location ~ ^/\.(git|jishi) { deny all; return 404; }

access_log /var/log/nginx/jishi.access.log;
error_log  /var/log/nginx/jishi.error.log;
