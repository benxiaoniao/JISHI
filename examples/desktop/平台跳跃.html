<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>平台跳跃 · 基石</title>
<!--
  M188 的第三个示例。页面只有「一块画布 + 一句 data-游戏」——
  启动逻辑在 `游戏启动.js`，游戏逻辑全在 `平台跳跃_游戏.jsh`。

  ⚠️ 直接双击 .html 不行（`file://` 下既不能 fetch 相邻文件，也读不了 wasm）。
     走 `jishi examples/desktop/平台跳跃.jsh`，或者把它放在站点上。
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #0b1220; color: #94a3b8; user-select: none;
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #画布 {
    display: block; border-radius: 12px; background: #7ec8e3;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6), 0 0 0 1px #1e293b inset;
    max-width: 96vw; max-height: 78vh;
  }
  #提示 {
    display: none; max-width: 720px; padding: 10px 14px; border-radius: 10px;
    background: #3b1d1d; color: #fca5a5; white-space: pre-wrap;
  }
  #底注 { opacity: .75; font-size: 13px; }
  kbd {
    padding: 1px 6px; border-radius: 4px; border: 1px solid #334155;
    background: #111827; color: #cbd5e1; font: inherit; font-size: 12px;
  }
</style>
</head>
<body data-游戏="平台跳跃_游戏.jsh" data-标题="平台跳跃">
  <canvas id="画布"></canvas>
  <div id="提示"></div>
  <div id="底注"><kbd>←</kbd> <kbd>→</kbd> 走 · <kbd>空格</kbd> / <kbd>↑</kbd> 跳 ·
    跑到右边的旗子那儿过关（掉下去会回到起点）</div>
  <script src="游戏启动.js"></script>
</body>
</html>
